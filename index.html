<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate Text Editor</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffffff;
}

.toolbar{
    background:#f0f0f0;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:1px solid #ccc;
    position:sticky;
    top:0;
}

button{
    padding:8px 12px;
    cursor:pointer;
    border:1px solid #ccc;
    border-radius:5px;
}

button:hover{
    background:#eaeaea;
}

#settingsPanel{
    display:none;
    padding:15px;
    background:#f9f9f9;
    border-bottom:1px solid #ccc;
}

#editor{
    min-height:700px;
    padding:20px;
    font-size:18px;
    outline:none;
}

#editor:empty:before{
    content:attr(data-placeholder);
    color:gray;
}

.setting-group{
    margin-bottom:12px;
}

</style>
</head>

<body>

<div class="toolbar">

<button onclick="document.execCommand('bold')">
<b>B</b>
</button>

<button onclick="document.execCommand('italic')">
<i>I</i>
</button>

<button onclick="document.execCommand('underline')">
<u>U</u>
</button>

<input type="color" id="textColor">
<button onclick="setTextColor()">
Text Color
</button>

<input type="color" id="highlightColor">
<button onclick="setHighlightColor()">
Highlight
</button>

<button onclick="saveFile()">
💾 Save
</button>

<button onclick="document.getElementById('openFile').click()">
📂 Open
</button>

<input
type="file"
id="openFile"
style="display:none"
onchange="openFile(event)"
>

<label>Auto Save</label>

<input
type="checkbox"
id="autoSave"
>

<button onclick="toggleSettings()">
⚙️ Settings
</button>

</div>


<div id="settingsPanel">

<h3>Settings</h3>

<div class="setting-group">
<label>Website Color</label>
<input type="color" id="pageColor">
<button onclick="changePageColor()">
Apply
</button>
</div>

<div class="setting-group">
<label>Editor Width (%)</label>
<input type="number" id="editorWidth" value="100">
<button onclick="changeWidth()">
Apply
</button>
</div>

<div class="setting-group">
<label>Editor Height (px)</label>
<input type="number" id="editorHeight" value="700">
<button onclick="changeHeight()">
Apply
</button>
</div>

<div class="setting-group">
<label>Font Size (px)</label>
<input type="number" id="fontSize" value="18">
<button onclick="changeFontSize()">
Apply
</button>
</div>

</div>


<div
id="editor"
contenteditable="true"
data-placeholder="Start typing here...">
</div>

<script>

const editor =
document.getElementById("editor");

const autoSave =
document.getElementById("autoSave");


window.onload=function(){

let savedText =
localStorage.getItem("editorText");

let savedColor =
localStorage.getItem("pageColor");

let savedAuto =
localStorage.getItem("autoSave");

if(savedText){
editor.innerHTML=savedText;
}

if(savedColor){
document.body.style.backgroundColor=
savedColor;
}

if(savedAuto==="true"){
autoSave.checked=true;
}

};


function setTextColor(){

let color=
document.getElementById("textColor").value;

document.execCommand(
"foreColor",
false,
color
);

}


function setHighlightColor(){

let color=
document.getElementById("highlightColor").value;

document.execCommand(
"hiliteColor",
false,
color
);

}


function saveFile(){

let blob=
new Blob(
[editor.innerHTML],
{type:"text/html"}
);

let link=
document.createElement("a");

link.href=
URL.createObjectURL(blob);

link.download=
"MyNotes.html";

link.click();

}


function openFile(event){

let file=
event.target.files[0];

if(!file) return;

let reader=
new FileReader();

reader.onload=function(e){

editor.innerHTML=
e.target.result;

};

reader.readAsText(file);

}


autoSave.addEventListener(
"change",
function(){

localStorage.setItem(
"autoSave",
this.checked
);

}
);


editor.addEventListener(
"input",
function(){

if(autoSave.checked){

localStorage.setItem(
"editorText",
editor.innerHTML
);

}

}
);


function toggleSettings(){

let panel=
document.getElementById(
"settingsPanel"
);

if(panel.style.display==="block"){
panel.style.display="none";
}else{
panel.style.display="block";
}

}


function changePageColor(){

let color=
document.getElementById("pageColor").value;

document.body.style.backgroundColor=
color;

localStorage.setItem(
"pageColor",
color
);

}


function changeWidth(){

let width=
document.getElementById("editorWidth").value;

editor.style.width=
width+"%";

}


function changeHeight(){

let height=
document.getElementById("editorHeight").value;

editor.style.minHeight=
height+"px";

}


function changeFontSize(){

let size=
document.getElementById("fontSize").value;

editor.style.fontSize=
size+"px";

}

</script>

</body>
</html>
