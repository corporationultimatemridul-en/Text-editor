<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Text Editor</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

.tabs{
    display:flex;
    background:#333;
}

.tabs button{
    background:none;
    border:none;
    color:white;
    padding:14px 20px;
    cursor:pointer;
}

.tabs button:hover{
    background:#555;
}

.panel{
    display:none;
    background:#f0f0f0;
    padding:10px;
    border-bottom:1px solid #ccc;
}

.active{
    display:block;
}

.toolbtn{
    padding:8px 12px;
    margin:3px;
    cursor:pointer;
}

#editor{
    min-height:600px;
    padding:20px;
    font-size:18px;
    outline:none;
}

#editor:empty:before{
    content:attr(data-placeholder);
    color:gray;
}

.statusbar{
    background:#eee;
    padding:10px;
    border-top:1px solid #ccc;
}

table{
    border-collapse:collapse;
}

td{
    border:1px solid black;
    min-width:80px;
    height:30px;
    padding:4px;
}

</style>
</head>

<body>

<div class="tabs">

<button onclick="showTab('file')">
📁 File
</button>

<button onclick="showTab('edit')">
✏️ Edit
</button>

<button onclick="showTab('insert')">
➕ Insert
</button>

<button onclick="showTab('settings')">
⚙️ Settings
</button>

</div>

<!-- FILE TAB -->

<div id="file" class="panel active">

<button class="toolbtn" onclick="newPage()">
📄 New Page
</button>

<button class="toolbtn"
onclick="document.getElementById('openFile').click()">
📂 Open
</button>

<button class="toolbtn"
onclick="saveFile()">
💾 Save
</button>

<input
type="file"
id="openFile"
style="display:none"
onchange="openFile(event)"
>

</div>

<!-- EDIT TAB -->

<div id="edit" class="panel">

<button class="toolbtn"
onclick="document.execCommand('bold')">
🅱️ Bold
</button>

<button class="toolbtn"
onclick="document.execCommand('italic')">
𝑰 Italic
</button>

<button class="toolbtn"
onclick="document.execCommand('underline')">
U̲ Underline
</button>

<input type="color" id="textColor">

<button class="toolbtn"
onclick="setTextColor()">
🎨 Text Color
</button>

<input type="color" id="highlightColor">

<button class="toolbtn"
onclick="setHighlightColor()">
🖍 Highlight
</button>

</div>

<!-- INSERT TAB -->

<div id="insert" class="panel">

<button class="toolbtn"
onclick="insertImage()">
🖼 Insert Image
</button>

<button class="toolbtn"
onclick="insertAudio()">
🔊 Insert Audio
</button>

<button class="toolbtn"
onclick="insertTable()">
📊 Insert Table
</button>

</div>

<!-- SETTINGS TAB -->

<div id="settings" class="panel">

<input type="color" id="pageColor">

<button class="toolbtn"
onclick="changePageColor()">
🌈 Page Color
</button>

<input
type="number"
id="fontSize"
value="18">

<button class="toolbtn"
onclick="changeFontSize()">
🔤 Font Size
</button>

<label>
💾 Auto Save
<input type="checkbox" id="autoSave">
</label>

</div>

<!-- EDITOR -->

<div
id="editor"
contenteditable="true"
data-placeholder="Start typing here...">
</div>

<!-- STATUS BAR -->

<div class="statusbar">

Words:
<span id="wordCount">0</span>

|

Characters:
<span id="charCount">0</span>

</div>

<script>

const editor =
document.getElementById("editor");

function showTab(tabId){

document.querySelectorAll(".panel")
.forEach(panel=>{
panel.classList.remove("active");
});

document.getElementById(tabId)
.classList.add("active");

}

function newPage(){

if(confirm("Create a new page?")){

editor.innerHTML="";

updateCounts();

}

}

function saveFile(){

let blob =
new Blob(
[editor.innerHTML],
{type:"text/html"}
);

let a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"MyDocument.html";

a.click();

}

function openFile(event){

let file =
event.target.files[0];

if(!file) return;

let reader =
new FileReader();

reader.onload =
function(e){

editor.innerHTML =
e.target.result;

updateCounts();

};

reader.readAsText(file);

}

function setTextColor(){

let color =
document.getElementById("textColor").value;

document.execCommand(
"foreColor",
false,
color
);

}

function setHighlightColor(){

let color =
document.getElementById("highlightColor").value;

document.execCommand(
"hiliteColor",
false,
color
);

}

function insertImage(){

let url =
prompt("Enter image URL:");

if(!url) return;

editor.innerHTML +=
'<br><img src="' +
url +
'" style="max-width:400px;"><br>';

}

function insertAudio(){

let url =
prompt("Enter audio URL:");

if(!url) return;

editor.innerHTML +=
'<br><audio controls src="' +
url +
'"></audio><br>';

}

function insertTable(){

let rows =
prompt("Enter rows:");

if(rows === null) return;

let cols =
prompt("Enter columns:");

if(cols === null) return;

rows = parseInt(rows);
cols = parseInt(cols);

if(
isNaN(rows) ||
isNaN(cols) ||
rows < 1 ||
cols < 1
){
alert("Enter valid numbers.");
return;
}

let html =
'<table>';

for(let r=0;r<rows;r++){

html += '<tr>';

for(let c=0;c<cols;c++){

html +=
'<td contenteditable="true"></td>';

}

html += '</tr>';

}

html += '</table><br>';

editor.innerHTML += html;

}

function changePageColor(){

let color =
document.getElementById("pageColor").value;

document.body.style.backgroundColor =
color;

localStorage.setItem(
"pageColor",
color
);

}

function changeFontSize(){

let size =
document.getElementById("fontSize").value;

editor.style.fontSize =
size + "px";

}

function updateCounts(){

let text =
editor.innerText;

let words =
text.trim()
? text.trim().split(/\s+/).length
: 0;

document.getElementById("wordCount")
.textContent = words;

document.getElementById("charCount")
.textContent = text.length;

}

editor.addEventListener(
"input",
function(){

updateCounts();

if(
document.getElementById("autoSave").checked
){

localStorage.setItem(
"editorData",
editor.innerHTML
);

}

}
);

window.onload=function(){

let saved =
localStorage.getItem(
"editorData"
);

if(saved){
editor.innerHTML = saved;
}

let color =
localStorage.getItem(
"pageColor"
);

if(color){
document.body.style.backgroundColor =
color;
}

updateCounts();

};

</script>

</body>
</html>
