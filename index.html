<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple Text Editor</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.toolbar {
    background: #eeeeee;
    padding: 10px;
    border-bottom: 1px solid #cccccc;
}

button {
    padding: 8px 12px;
    margin-right: 5px;
    cursor: pointer;
}

#editor {
    min-height: 500px;
    padding: 15px;
    outline: none;
    font-size: 18px;
}
</style>

</head>
<body>

<div class="toolbar">

<button onclick="document.execCommand('bold')">
<b>B</b>
</button>

<button onclick="document.execCommand('italic')">
<i>I</i>
</button>

<button onclick="document.execCommand('underline')">
<u>U</u>
</button>

<label>Text Color:</label>
<input type="color" id="textColor">

<label>Highlight:</label>
<input type="color" id="highlightColor">

<button onclick="setTextColor()">Apply Color</button>

<button onclick="setHighlight()">Apply Highlight</button>

</div>

<div id="editor" contenteditable="true">
Type your text here...
</div>

<script>

function setTextColor() {
    let color = document.getElementById("textColor").value;
    document.execCommand("foreColor", false, color);
}

function setHighlight() {
    let color = document.getElementById("highlightColor").value;
    document.execCommand("hiliteColor", false, color);
}

</script>

</body>
</html>
