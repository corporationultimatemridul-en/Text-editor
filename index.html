<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Text Editor</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}

.tabs{
    display:flex;
    background:#333;
}

.tab{
    color:white;
    padding:12px 20px;
    cursor:pointer;
}

.tab:hover{
    background:#555;
}

.panel{
    display:none;
    padding:10px;
    background:#f0f0f0;
    border-bottom:1px solid #ccc;
}

.active{
    display:block;
}

button{
    padding:8px 12px;
    margin:3px;
    cursor:pointer;
}

#editor{
    min-height:600px;
    padding:20px;
    outline:none;
    font-size:18px;
}

#editor:empty:before{
    content:attr(data-placeholder);
    color:gray;
}

.statusbar{
    background:#eee;
    padding:10px;
    border-top:1px solid #ccc;
}
</style>

</head>
<body>

<div class="tabs">
    <div class="tab" onclick="showTab('file')">📁 File</div>
    <div class="tab" onclick="showTab('edit')">✏️ Edit</div>
    <div class="tab" onclick="showTab('insert')">➕ Insert</div>
    <div class="tab" onclick="showTab('settings')">⚙️ Settings</div>
</div>

<div id="file" class="panel active">

    <button onclick="newPage()">📄 New</button>

    <button onclick="document.getElementById('openFile').click()">
        📂 Open
    </button>

    <button onclick="saveFile()">
        💾 Save
    </button>

    <input
    type="file"
    id="openFile"
    style="display:none"
    onchange="openFile(event)">

</div>

<div id="edit" class="panel">

    <button onclick="document.execCommand('bold')">
        🅱️ Bold
    </button>

    <button onclick="document.execCommand('italic')">
        𝑰 Italic
    </button>

    <button onclick="document.execCommand('underline')">
        U̲ Underline
    </button>

    <input type="color" id="textColor">
    <button onclick="setTextColor()">
        🎨 Text Color
    </button>

    <input type="color" id="highlightColor">
    <button onclick="setHighlight()">
        🖍 Highlight
    </button>

</div>

<div id="insert" class="panel">

    <button onclick="insertImage()">
        🖼 Insert Image
    </button>

    <button onclick="insertAudio()">
        🔊 Insert Audio
    </button>

    <button onclick="insertTable()">
        📊 Insert Table
    </button>

</div>

<div id="settings" class="panel">

    <input type="color" id="pageColor">

    <button onclick="changePageColor()">
        🌈 Page Color
    </button>

    <input
    type="number"
    id="fontSize"
    value="18">

    <button onclick="changeFontSize()">
        🔤 Font Size
    </button>

    <label>
        💾 Auto Save
        <input type="checkbox" id="autoSave">
    </label>

</div>

<div
id="editor"
contenteditable="true"
data-placeholder="Start typing here...">
</div>

<div class="statusbar">
    Words:
    <span id="wordCount">0</span>
    |
    Characters:
    <span id="charCount">0</span>
</div>

<script>

const editor =
document.getElementById("editor");

function showTab(tabId){

document.querySelectorAll(".panel")
.forEach(panel=>{
panel.classList.remove("active");
});

document.getElementById(tabId)
.classList.add("active");

}

function newPage(){

if(confirm("Create new document?")){
editor.innerHTML="";
updateCounts();
}

}

function saveFile(){

let blob =
new Blob(
[editor.innerHTML],
{type:"text/html"}
);

let link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"Document.html";

link.click();

}

function openFile(event){

let file =
event.target.files[0];

if(!file) return;

let reader =
new FileReader();

reader.onload = function(e){

editor.innerHTML =
e.target.result;

updateCounts();

};

reader.readAsText(file);

}

function setTextColor(){

let color =
document.getElementById("textColor").value;

document.execCommand(
"foreColor",
false,
color
);

}

function setHighlight(){

let color =
document.getElementById("highlightColor").value;

document.execCommand(
"hiliteColor",
false,
color
);

}

function insertImage(){

let url =
prompt("Enter Image URL");

if(!url) return;

editor.innerHTML +=
'<br><img src="' +
url +
'" style="max-width:400px;"><br>';

}

function insertAudio(){

let url =
prompt("Enter Audio URL");

if(!url) return;

editor.innerHTML +=
'<br><audio controls src="' +
url +
'"></audio><br>';

}

function insertTable(){

let rows =
prompt("Enter rows");

if(rows === null) return;

let cols =
prompt("Enter columns");

if(cols === null) return;

rows = parseInt(rows);
cols = parseInt(cols);

if(
isNaN(rows) ||
isNaN(cols) ||
rows < 1 ||
cols < 1
){

alert("Invalid value");
return;

}

let html =
'<table border="1" style="border-collapse:collapse;margin:10px 0;">';

for(let r=0;r<rows;r++){

html += '<tr>';

for(let c=0;c<cols;c++){

html +=
'<td contenteditable="true" style="width:80px;height:35px;padding:5px;"></td>';

}

html += '</tr>';

}

html += '</table><br>';

editor.innerHTML += html;

}

function changePageColor(){

let color =
document.getElementById("pageColor").value;

document.body.style.backgroundColor =
color;

localStorage.setItem(
"pageColor",
color
);

}

function changeFontSize(){

let size =
document.getElementById("fontSize").value;

editor.style.fontSize =
size + "px";

}

function updateCounts(){

let text =
editor.innerText;

let words =
text.trim()
? text.trim().split(/\s+/).length
: 0;

document.getElementById("wordCount")
.textContent = words;

document.getElementById("charCount")
.textContent = text.length;

}

"input",
