<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Editor</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

.tabs{
    background:#333;
    padding:10px;
}

.tabs button{
    background:#444;
    color:white;
    border:none;
    padding:10px 15px;
    margin-right:5px;
    cursor:pointer;
}

.panel{
    display:none;
    padding:10px;
    background:#eeeeee;
}

#file{
    display:block;
}

.toolbtn{
    padding:8px 12px;
    margin:3px;
}

#editor{
    min-height:600px;
    padding:20px;
    width:100%;
    box-sizing:border-box;
    font-size:18px;
    outline:none;
}

#editor:empty:before{
    content:"Start typing here...";
    color:gray;
}

</style>
</head>

<body>

<div class="tabs">

<button onclick="showTab('file')">📁 File</button>

<button onclick="showTab('edit')">✏️ Edit</button>

<button onclick="showTab('insert')">➕ Insert</button>

<button onclick="showTab('settings')">⚙️ Settings</button>

</div>

<div id="file" class="panel">

<button class="toolbtn" onclick="newPage()">
📄 New Page
</button>

<button class="toolbtn"
onclick="document.getElementById('openFile').click()">
📂 Open
</button>

<button class="toolbtn" onclick="saveFile()">
💾 Save
</button>

<input
type="file"
id="openFile"
style="display:none"
onchange="openFile(event)">

</div>

<div id="edit" class="panel">

<button class="toolbtn"
onclick="document.execCommand('bold')">
🅱️ Bold
</button>

<button class="toolbtn"
onclick="document.execCommand('italic')">
𝑰 Italic
</button>

<button class="toolbtn"
onclick="document.execCommand('underline')">
U̲ Underline
</button>

</div>

<div id="insert" class="panel">

<button class="toolbtn"
onclick="insertImage()">
🖼 Image
</button>

<button class="toolbtn"
onclick="insertAudio()">
🔊 Audio
</button>

<button class="toolbtn"
onclick="insertTable()">
📊 Table
</button>

</div>

<div id="settings" class="panel">

<input type="color" id="pageColor">

<button class="toolbtn"
onclick="changePageColor()">
🌈 Page Color
</button>

<br><br>

<label>📏 Page Width (%)</label>

<input
type="number"
id="pageWidth"
value="100"
min="20"
max="100">

<button class="toolbtn"
onclick="changeWidth()">
Apply Width
</button>

<br><br>

<label>🔤 Font Size</label>

<input
type="number"
id="fontSize"
value="18"
min="10"
max="72">

<button class="toolbtn"
onclick="changeFontSize()">
Apply Font Size
</button>

</div>

<div id="editor"
contenteditable="true">
</div>

<script>

function showTab(tabId){

let panels =
document.getElementsByClassName("panel");

for(let i=0;i<panels.length;i++){

panels[i].style.display="none";

}

document.getElementById(tabId)
.style.display="block";

}

function newPage(){

document.getElementById("editor")
.innerHTML="";

}

function saveFile(){

let text =
document.getElementById("editor")
.innerHTML;

let blob =
new Blob(
[text],
{type:"text/html"}
);

let a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"Document.html";

a.click();

}

function openFile(event){

let file =
event.target.files[0];

if(!file) return;

let reader =
new FileReader();

reader.onload =
function(e){

document.getElementById("editor")
.innerHTML =
e.target.result;

};

reader.readAsText(file);

}

function insertImage(){

let url =
prompt("Enter image URL:");

if(url){

document.getElementById("editor")
.innerHTML +=
'<br><img src="'+url+'" width="300"><br>';

}

}

function insertAudio(){

let url =
prompt("Enter audio URL:");

if(url){

document.getElementById("editor")
.innerHTML +=
'<br><audio controls src="'+url+'"></audio><br>';

}

}

function insertTable(){

let rows =
prompt("Rows:");

let cols =
prompt("Columns:");

rows = parseInt(rows);
cols = parseInt(cols);

if(isNaN(rows)||isNaN(cols)) return;

let table =
"<table border='1' style='border-collapse:collapse'>";

for(let r=0;r<rows;r++){

table += "<tr>";

for(let c=0;c<cols;c++){

table +=
"<td contenteditable='true' style='width:80px;height:30px'></td>";

}

table += "</tr>";

}

table += "</table><br>";

document.getElementById("editor")
.innerHTML += table;

}

function changePageColor(){

document.body.style.backgroundColor =
document.getElementById("pageColor").value;

}

function changeWidth(){

let width =
document.getElementById("pageWidth").value;

document.getElementById("editor")
.style.width =
width + "%";

}

function changeFontSize(){

let size =
document.getElementById("fontSize").value;

document.getElementById("editor")
.style.fontSize =
size + "px";

}

</script>

</body>
</html>
